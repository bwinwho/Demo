<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f7f6f2">
<meta name="color-scheme" content="light">
<title>Agency Pilot V2</title>
<style id="pageSize"></style>
<style>
/* ================= AGENCY PILOT V2 — Swiss editorial design system ================= */
:root{
  /* colour — predominantly monochrome. Green = important positive action. Red = real dues, shortages, errors. */
  --bg:#f7f6f2;          /* warm white page */
  --paper:#ffffff;
  --tint:#efeee9;        /* pale grey surface: settlement receipts, pressed rows */
  --ink:#111110;
  --ink2:#3a3936;        /* graphite */
  --mute:#67655f;
  --faint:#9a978f;
  --line:#e2e0d9;        /* hairline divider */
  --line2:#c8c5bc;       /* control outline */
  --char:#1c1c1a;        /* graphite for the few dark moments */
  --green:#00763f;
  --green-d:#005a30;
  --red:#b3261e;
  --on-dark-mute:rgba(255,255,255,.66);
  --hair-dark:rgba(255,255,255,.14);
  /* geometry */
  --r:2px;
  --r2:4px;
  --tap:52px;
  /* spacing scale: 4 / 8 / 12 / 16 / 24 / 32 / 48 */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --gut:20px;            /* page gutter — every list, rule and title aligns to it */
  --font:"Helvetica Neue","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#e6e5e0;color:var(--ink);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pane.ink :focus-visible,.btn.black:focus-visible,.btn.primary:focus-visible,.btn.danger:focus-visible{outline-color:#fff;outline-offset:-4px}
/* financial figures always line up */
.r,.kv,.big,.huge,.amt,.n,.flowbar b,.ol .nm,.ol .ln,.tile b,.rc-amt,.rc-ref,.rc-bal,.rc-end,.tl time,.denom input,.stepper input{font-variant-numeric:tabular-nums}

/* ---------- shell: centred phone-width app ---------- */
#app{position:relative;margin:0 auto;height:100vh;height:100dvh;max-width:430px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){
  body{display:flex;align-items:center;justify-content:center}
  #app{height:min(100dvh - 48px,880px);width:430px;box-shadow:0 0 0 1px rgba(17,17,16,.10),0 28px 60px -20px rgba(17,17,16,.22)}
}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.enter{animation:inR .24s var(--ease) both}
.screen.enter-back{animation:inL .24s var(--ease) both}
.screen.leave{animation:fadeOut .14s ease-in both;pointer-events:none}
@keyframes inR{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- header: quiet arrow · left-aligned editorial title · optional help ---------- */
.hdr{display:flex;align-items:center;gap:var(--s1);padding:calc(var(--s2) + env(safe-area-inset-top)) var(--s3) var(--s2) var(--s1);min-height:64px}
.hdr .back{flex:none;width:48px;height:48px;display:grid;place-items:center;color:var(--ink);border-radius:var(--r)}
.hdr .back:active{background:var(--tint)}
.hdr .back svg{width:22px;height:22px}
.hdr .ttl{flex:1;min-width:0;text-align:left;padding-left:var(--s1)}
.hdr.nohdr-back .ttl{padding-left:calc(var(--gut) - var(--s1))}
.hdr .ttl h1{margin:0;font-size:19px;line-height:1.2;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.hdr .ttl h1.big{font-size:34px;line-height:1.04;letter-spacing:-.03em}
.hdr .ttl .sub{font-size:13px;color:var(--mute);margin-top:3px}
.hdr .ttl .eyebrow{margin-bottom:var(--s2)}
.hdr.root{padding-top:calc(var(--s5) + env(safe-area-inset-top));padding-bottom:var(--s3)}
.hdr.stack{flex-wrap:wrap;padding-bottom:var(--s3)}
.hdr.stack .ttl{order:3;flex-basis:100%;padding:var(--s1) 0 0 calc(var(--gut) - var(--s1))}
.hdr .help{flex:none;margin-left:auto;width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--ink2);position:relative}
.hdr .help::before{content:"";position:absolute;inset:8px;border:1px solid var(--line2);border-radius:50%;z-index:-1}
.hdr .help{isolation:isolate}
.hdr .help[aria-pressed=true]{color:#fff}
.hdr .help[aria-pressed=true]::before{background:var(--ink);border-color:var(--ink)}
.stepline{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding:0 var(--gut) var(--s2);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.stepline b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prog{height:2px;background:var(--line);margin:0 var(--gut);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s var(--ease)}

/* ---------- body / foot ---------- */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:var(--s4) var(--gut) var(--s6);display:flex;flex-direction:column}
.body>*{flex:none}
.body.center>.mid{margin:auto 0;flex:none}
.foot{flex:none;padding:var(--s3) var(--gut) calc(var(--s4) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s2);background:var(--bg);border-top:1px solid var(--line)}
.foot.row2{flex-direction:row}
.foot.row2>*{flex:1;min-width:0}
.btnrow,.foot .pair{display:flex;gap:var(--s2)}
.btnrow>*,.foot .pair>*{flex:1;min-width:0}
.btnrow.split>.btn.primary{flex:2}
.linkrow{display:flex;justify-content:center;flex-wrap:wrap;column-gap:var(--s5)}
.linkrow>.btn{width:auto;padding:0 var(--s1)}

/* ---------- tab bar: architectural, neutral ---------- */
.tabbar{flex:none;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mute);font-size:10px;font-weight:600;letter-spacing:.12em;position:relative}
.tabbar button svg{width:20px;height:20px;stroke-width:1.6}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:50%;width:24px;margin-left:-12px;height:2px;background:var(--ink)}
.tabbar .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
#app.flow .tabbar{display:none}

/* ---------- buttons: primary (filled) · secondary (outlined) · tertiary (text) · destructive ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:var(--tap);padding:10px 18px;border:1px solid transparent;border-radius:var(--r);font-size:14px;font-weight:600;letter-spacing:.07em;text-align:center;line-height:1.25;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:active{background:var(--green-d)}
.btn.black{background:var(--ink);color:#fff}
.btn.black:active{background:#000}
.btn.dark{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.dark:active,.btn.ghost:active,.btn.neg:active{background:var(--tint)}
.btn.danger{background:var(--red);color:#fff}
.btn.neg{background:transparent;color:var(--red);border-color:currentColor}
.pane.ink .btn.ghost,.pane.ink .btn.dark{border-color:rgba(255,255,255,.7);color:#fff}
.pane.ink .btn.ghost:active{background:rgba(255,255,255,.08)}
summary{cursor:pointer}
.btn.link{background:none;border:0;color:var(--ink2);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;font-weight:500;font-size:12.5px;letter-spacing:.1em;min-height:44px}
.btn.link.neg{color:var(--red)}
.btn.sm{min-height:44px;font-size:12.5px;width:auto;padding:6px 14px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.32;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.btn small{display:block;font-weight:400;font-size:13px;letter-spacing:0;opacity:.75;margin-top:3px}
.btn.dark>span,.btn.ghost>span{text-align:center}

/* ---------- lists: open rows on a top rule (no boxes). .pane.ink = a rare dark moment ---------- */
.pane{color:var(--ink);border-top:1px solid var(--ink)}
.pane .pad{padding:var(--s4) 0}
.pane>.pad.center{text-align:left}
.pane.ink{background:var(--char);color:#fff;border-top:0;padding:0 var(--s4);border-radius:var(--r)}
.pane.ink .eyebrow{color:var(--on-dark-mute)}
.pane.ink .kv span:first-child{color:var(--on-dark-mute)}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) 0;text-align:left;color:inherit;border-bottom:1px solid var(--line)}
button.row:active{background:var(--tint)}
.row .t{font-weight:500;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.row .s{font-size:13.5px;color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.row .l{flex:1;min-width:0}
.row .r{text-align:right;flex:none;font-weight:500;font-size:16px}
.row .r small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.09em;color:var(--mute);margin-top:4px;text-transform:uppercase}
.row .chev{flex:none;width:16px;height:16px;color:var(--faint)}
.row.off{opacity:.42}
.row.new{background:linear-gradient(90deg,rgba(0,118,63,.09),rgba(0,118,63,0) 70%);box-shadow:inset 2px 0 0 var(--green);padding-left:var(--s3)}
.empty{padding:var(--s6) 0;color:var(--mute)}
.pane:empty{display:none}
.chip{display:inline-block;padding:1px 6px;border:1px solid currentColor;border-radius:var(--r);font-size:10.5px;font-weight:600;letter-spacing:.09em;line-height:1.6;color:var(--ink2);text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.chip.ok{color:var(--green)}
.chip.bad{color:var(--red)}
.chip.warn{border-style:dashed}
.chip.line{color:inherit}
.pane.ink .chip{color:#fff}

/* ---------- typography ---------- */
.eyebrow{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.big{font-size:30px;font-weight:600;line-height:1.08;letter-spacing:-.025em}
.huge{font-size:44px;font-weight:600;line-height:1.02;letter-spacing:-.035em}
.mute{color:var(--mute)}
.red{color:var(--red)}
.green{color:var(--green)}
.center{text-align:center}
.mt8{margin-top:var(--s2)}.mt12{margin-top:var(--s3)}.mt16{margin-top:var(--s4)}.mt24{margin-top:var(--s5)}
.gap{display:flex;flex-direction:column;gap:var(--s4)}
.sec{margin:var(--s6) 0 var(--s3);font-size:11px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.sec>span+span{color:var(--mute);font-variant-numeric:tabular-nums}
.gap>.sec{margin:var(--s4) 0 calc(-1 * var(--s1))}
.aside{font-size:14px;line-height:1.5;color:var(--ink2);padding:2px 0 2px var(--s3);border-left:2px solid var(--line2)}
.aside b{color:var(--ink);font-weight:600}
.aside.bad{border-left-color:var(--red)}

/* ---------- forms ---------- */
.input,.select{width:100%;min-height:52px;font-size:17px;font-weight:400;padding:0 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--paper);color:var(--ink);text-transform:none;letter-spacing:normal}
.input:focus,.select:focus{outline:none;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.input::placeholder{color:var(--faint)}
textarea.input{padding:12px 14px;min-height:96px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:var(--s5) 0 var(--s2)}
.lbl>.input,.lbl>.select{margin-top:var(--s2);display:block}
.input.err{border-color:var(--red)}
.errtxt{color:var(--red);font-size:14px;font-weight:500;margin-top:6px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink2);pointer-events:none}
.search .input{padding-left:44px;border-color:var(--ink)}
.oq{text-align:left}
.oq .q{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.oq .a{width:100%;margin-top:var(--s3);font-size:30px;font-weight:500;letter-spacing:-.015em;text-align:left;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:8px 0;border-radius:0;min-height:60px}
.oq .a:focus{outline:none;border-bottom-color:var(--green)}
.oq .a::placeholder{color:#c4c1b8}
.oq .hint{margin-top:var(--s3);font-size:14px;color:var(--mute)}
.center .oq,.oq.center{text-align:center}

/* steppers: square, outlined */
.stepper{display:flex;align-items:center}
.stepper button{flex:none;width:48px;height:48px;border:1px solid var(--ink);border-radius:var(--r);background:transparent;color:var(--ink);font-size:24px;font-weight:300;line-height:1;display:grid;place-items:center}
.stepper button:active{background:var(--tint)}
.stepper button:disabled{opacity:.25}
.stepper input{width:64px;min-height:48px;margin:0 var(--s1);text-align:center;font-size:21px;font-weight:600;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;color:var(--ink)}
.stepper input:focus{outline:none;border-bottom:2px solid var(--ink)}
.unitrow{display:flex;align-items:center;gap:10px;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.unitrow:last-child{border-bottom:0}
.pane>.unitrow:last-child{border-bottom:1px solid var(--line)}
.unitrow .u{flex:1;min-width:0}
.unitrow .u b{font-size:17px;font-weight:600;letter-spacing:.02em}
.unitrow .u span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.card.dark{background:var(--char);color:#fff;border-color:var(--char)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding:var(--s2) 0}
.kv span:first-child{flex:0 1 auto;max-width:62%;color:var(--mute);font-size:14px}
.kv span:last-child,.kv b:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}
.kv.tot{border-top:1px solid var(--ink);margin-top:var(--s2);padding-top:var(--s3);font-weight:600;font-size:22px;letter-spacing:-.015em}
.kv.tot span:first-child{color:var(--ink);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.pane.ink .kv.tot{border-top-color:var(--hair-dark)}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.hrow span:first-child{min-width:0;overflow-wrap:anywhere}
.hrow span:last-child{flex:none}
.divider{height:1px;background:var(--line);margin:var(--s4) 0}

/* order lines — a compact operational document */
.ol{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.ol .nm{font-weight:500;font-size:17px;display:flex;justify-content:space-between;gap:10px}
.ol .nm span:last-child{font-weight:600;flex:none}
.ol .ln{display:grid;grid-template-columns:1fr auto auto;gap:2px var(--s4);font-size:14px;margin-top:var(--s1);color:var(--ink2);align-items:baseline}
.ol .ln .a{text-align:right;min-width:68px}
.ol .ln .rt{color:var(--mute)}
.ol .sub{display:flex;justify-content:flex-end;gap:12px;margin-top:6px;font-weight:600}
.ol.strike .nm,.ol.strike .ln{text-decoration:line-through;opacity:.5}
.ol-tot{padding:var(--s2) 0 0}
.ol-tot .kv:not(.tot){padding:var(--s1) 0}
.ol-tot .kv.tot{border-top-width:2px;margin-top:var(--s3);font-size:26px}
.dochead{padding:var(--s1) 0 0}
.dochead .meta{font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.docst{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3)}
.tl{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);font-size:14.5px;align-items:baseline;padding-top:var(--s1)}
.tl time{color:var(--mute);font-size:13px;white-space:nowrap}
.tl span{color:var(--ink2)}
.tl span:last-child{color:var(--ink)}

/* help card · toast · sheet */
.helpcard{background:var(--paper);border:1px solid var(--line);border-left:2px solid var(--green);padding:var(--s3) 48px var(--s3) var(--s4);margin:0 0 var(--s4);font-size:14.5px;color:var(--ink2);position:relative}
.helpcard b{display:block;margin-bottom:var(--s1);color:var(--ink);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.helpcard div+div{margin-top:var(--s1)}
.helpcard button{position:absolute;top:0;right:0;width:46px;height:46px;font-size:20px;color:var(--ink2)}
.toast{position:absolute;left:var(--s4);right:var(--s4);top:calc(var(--s3) + env(safe-area-inset-top));pointer-events:none;background:var(--char);color:#fff;border-radius:var(--r);padding:13px var(--s4);display:flex;gap:10px;align-items:center;z-index:50;font-weight:500;font-size:15px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);animation:toastIn .22s var(--ease) both}
@keyframes toastIn{from{transform:translateY(-8px);opacity:0}}
.toast svg{flex:none;width:20px;height:20px;color:#7fe0a8}
.toast.bad svg{color:#ff8a80}
.sheetbg{position:absolute;inset:0;background:rgba(17,17,16,.42);z-index:40;display:flex;align-items:flex-end;animation:fadeIn .16s both}
@keyframes fadeIn{from{opacity:0}}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:var(--r2) var(--r2) 0 0;padding:var(--s5) var(--gut) calc(var(--s4) + env(safe-area-inset-bottom));animation:up .24s var(--ease) both}
@keyframes up{from{transform:translateY(28px);opacity:0}}
.sheet h2{margin:0 0 var(--s1);font-size:21px;font-weight:600;letter-spacing:-.015em}
.sheet-act{position:sticky;bottom:calc(-1 * (var(--s4) + env(safe-area-inset-bottom)));margin:var(--s4) calc(-1 * var(--gut)) calc(-1 * (var(--s4) + env(safe-area-inset-bottom)));padding:var(--s3) var(--gut) calc(var(--s4) + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s2)}
.sheet .x{position:absolute;right:8px;top:8px}

/* auth checkpoint (simulated approval) */
.auth{border:1px dashed var(--ink);padding:var(--s4);background:var(--paper)}
.auth .lock{display:flex;gap:var(--s2);align-items:center;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.auth .lock svg{width:18px;height:18px}
.auth p{margin:var(--s2) 0 0;font-size:14px;line-height:1.5;color:var(--ink2)}

/* denominations: the banknote colour survives only as a thin edge, for recognition */
.denom{display:flex;align-items:center;gap:10px;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.denom:last-child{border-bottom:1px solid var(--line)}
.denom .note{flex:none;width:68px;height:40px;border:1px solid var(--line2);border-left-width:6px;border-radius:var(--r);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--ink);background:var(--paper)}
.denom .x{color:var(--mute);font-weight:500}
.denom .amt{flex:1;text-align:right;font-weight:600;font-size:16px;min-width:0}
.denom input{width:64px;min-height:44px;text-align:center;font-size:19px;font-weight:600;border:1px solid var(--line2);border-radius:var(--r);background:var(--paper)}
.denom input:focus{outline:none;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.n500{border-left-color:#8f927e}.n200{border-left-color:#e0a548}.n100{border-left-color:#8c82cf}.n50{border-left-color:#6fb6c2}.n20{border-left-color:#c9a64f}.n10{border-left-color:#c08a63}.nc{border-left-color:#b9b7b0}

.seg{display:flex;gap:6px;flex-wrap:wrap}

}
const kbal = (pid, cat) => S.khata.reduce((s, e) => e.pid === pid && (!cat || e.cat === cat) ? s + e.amt : s, 0);
function kcats(pid) { const o = {}; for (const e of S.khata) if (e.pid === pid) o[e.cat] = (o[e.cat] || 0) + e.amt; for (const k in o) if (!o[k]) delete o[k]; return o; }
const khataParties = () => Array.from(new Set(S.khata.map(e => e.pid)));

/* ---- CashBook: only VERIFIED receipts and ACTUAL payments change these balances ---- */
function cashPost(acct, amt, kind, cat, desc, o) {
  o = o || {};
  if (acct !== 'CASH' && acct !== 'BANK') fail('Unknown money account');
  if (cbal(acct) + amt < 0) fail('Not enough money in ' + (acct === 'CASH' ? 'cash' : 'the bank') + ' for this (' + rs(cbal(acct)) + ' available).');
  const e = { id: nid('m'), seq: S.cash.length + 1, at: o.at || new Date(), dayNo: o.dayNo != null ? o.dayNo : S.day.no, acct, amt, kind, cat, desc, pid: o.pid || null, ref: o.ref || null };
  S.cash.push(e); return e;
}
const cbal = acct => S.cash.reduce((s, e) => e.acct === acct ? s + e.amt : s, 0);
function dayFigures() {
  const es = S.cash.filter(e => e.dayNo === S.day.no && e.acct === 'CASH');
  const sum = k => es.filter(e => e.kind === k).reduce((s, e) => s + e.amt, 0);
  const received = sum('RECEIPT'), paid = -sum('PAYMENT'), moved = sum('TRANSFER'), adj = sum('ADJUST');
  const expected = S.day.openCash + received - paid + moved;
  return { opening: S.day.openCash, received, paid, moved, adj, expected, books: expected + adj };
}

/* ---- Stock: ONE canonical base-unit balance per product. BOX/LADI/JAR are just ways of counting it. ---- */
const avail = pid => S.godown[pid] || 0;
function moveGodown(pid, delta, reason, ref, note) {
  const cur = avail(pid);
  if (cur + delta < 0) fail('Not enough ' + prod(pid).name + ' in the godown — only ' + qtyText(prod(pid), cur) + ' available.');
  S.godown[pid] = cur + delta;
  S.moves.push({ id: nid('mv'), at: new Date(), pid, delta, after: S.godown[pid], reason, ref: ref || null, note: note || '' });
}
function stockStatus(pid) {
  const pr = prod(pid), a = avail(pid);
  if (a <= 0) return 'OUT';
  return a < 2 * pr.levels[0].n ? 'LOW' : 'OK';
}
const holdOf = pid => S.hold.filter(x => x.pid === pid).reduce((s, x) => s + x.base, 0);
function addHold(pid, base, kind, source, note) {

  log('HOLD', qtyText(prod(pid), base) + ' ' + prod(pid).name + ' kept as ' + kind.toLowerCase() + ' (not sellable) — ' + source);
}

/* ---------------------------------------------------------------------
   4b. Orders · Pickups · Loading · Custody · Delivery · Side sales · Challans · Sales(bills)
   Rules enforced here:
   - An ORDER is a customer request. It is NOT a stock movement.
   - Confirmed loading deducts godown stock EXACTLY ONCE and moves it to the pickup's custody.
   - Delivery / side sale only reduce pickup custody — never godown again.
   - DC (goods movement) ≠ BILL (money charge) ≠ ORDER (request).
   --------------------------------------------------------------------- */
function mkLine(pid, units) {
  const pr = prod(pid); const base = toBase(pr, units);
  const clean = {}; for (const u of unitList(pr)) if (parseInt(units[u], 10) > 0) clean[u] = parseInt(units[u], 10);
  return { pid, units: clean, base };
}
/* total of lines at given per-base prices; paise are waived to a whole rupee (PROVISIONAL shop practice, shown on every bill) */
function totalsOf(lines, prices) {
  let items = 0;
  const rows = lines.map(l => { const rate = prices[l.pid]; const amt = l.base * rate; items += amt; return { pid: l.pid, base: l.base, units: l.units, rate, amt }; });
  const waived = items % 100;
  return { rows, items, waived, total: items - waived };
}
const orderTotals = o => totalsOf(o.lines, o.prices);
const currentPrices = () => { const m = {}; for (const p of S.products) m[p.id] = p.sell; return m; };

/* ---- orders ---- */
function createOrder(partyId, lines, token) {
  if (tokUsed(token)) fail('This order was already confirmed.');
  if (!party(partyId)) fail('Please choose a customer.');
  if (!lines.length) fail('Add at least one product.');
  tokUse(token);
  const prices = {}; lines.forEach(l => prices[l.pid] = prod(l.pid).sell);
  const o = { id: nid('o'), no: nextNo('O', 'O'), partyId, lines: lines.map(l => ({ ...l, units: { ...l.units } })), prices, status: 'WAITING', createdAt: new Date(), tripId: null, alloc: null, saleId: null,
    needsApproval: needsApprovalParty(partyId), approved: false, history: [{ at: new Date(), text: 'Order taken' }] };
  S.orders.push(o);
  log('ORDER', 'Order ' + o.no + ' taken for ' + partyName(partyId) + ' — ' + rs(orderTotals(o).total), { order: o.id });
  return o;
}
function updateOrder(id, lines) {
  const o = orderOf(id); if (!o) fail('Order not found.');
  if (o.status !== 'WAITING') fail('This order is already being loaded, so it can no longer be edited.');
  if (!lines.length) fail('An order needs at least one product. Cancel the order instead.');
  const before = orderTotals(o).total;
  lines.forEach(l => { if (o.prices[l.pid] == null) o.prices[l.pid] = prod(l.pid).sell; });
  o.lines = lines.map(l => ({ ...l, units: { ...l.units } }));
  const after = orderTotals(o).total;
  o.history.push({ at: new Date(), text: 'Edited — total ' + rs(before) + ' → ' + rs(after) });
  log('ORDER', 'Order ' + o.no + ' edited — total ' + rs(before) + ' → ' + rs(after), { order: o.id });
  return o;
}
function approveOrder(id) {
  const o = orderOf(id); if (!o) fail('Order not found.');
  o.approved = true; o.history.push({ at: new Date(), text: 'Manager approved stock for release (no goods moved yet)' });
  approve('MANAGER_STOCK', 'Manager approved stock for ' + o.no + ' (' + partyName(o.partyId) + ') — approval is not physical release');
}
function cancelOrder(id) {
  const o = orderOf(id); if (!o) return;
  if (o.status !== 'WAITING') fail('Only a waiting order can be cancelled.');
  o.status = 'CANCELLED'; o.history.push({ at: new Date(), text: 'Cancelled' }); log('ORDER', 'Order ' + o.no + ' cancelled');
}
function orderState(o) {
  const sale = o.saleId ? saleOf(o.saleId) : null;
  const due = sale ? saleDue(sale) : 0;
  const map = { WAITING: o.needsApproval && !o.approved ? ['NEEDS APPROVAL', 'warn'] : ['WAITING', ''], LOADING: ['LOADING', ''], LOADED: ['LOADED', 'ok'], ON_ROAD: ['ON THE ROAD', ''],
    DELIVERED: ['DELIVERED', 'ok'], PARTIAL: ['PARTLY DELIVERED', 'warn'], NOT_DELIVERED: ['NOT DELIVERED', 'bad'], CANCELLED: ['CANCELLED', 'bad'] };
  const m = map[o.status] || [o.status, ''];
  return { text: m[0], tone: m[1], due, sale };
}
const isOpenOrder = o => !['CANCELLED'].includes(o.status);
const isActiveOrder = o => ['WAITING', 'LOADING', 'LOADED', 'ON_ROAD'].includes(o.status) || (o.saleId && saleDue(saleOf(o.saleId)) > 0 && !saleOf(o.saleId).dueMarked);

/* ---- pickups (a pickup = one vehicle run carrying one or more customer orders) ---- */
const tripLive = t => ['LOADING', 'READY', 'ON_ROAD', 'RETURNED'].includes(t.status);
const busyStaff = (sid, except) => S.trips.some(t => t.id !== except && tripLive(t) && (t.driverId === sid || t.helperId === sid));
const busyVehicle = (vid, except) => S.trips.some(t => t.id !== except && tripLive(t) && t.vehicleId === vid);
function makeDC(type, o) {
  const d = { id: nid('d'), no: nextNo('DC', 'DC'), type, orderId: o.orderId || null, tripId: o.tripId || null, partyId: o.partyId || null, buyerName: o.buyerName || '', status: o.status || 'PREPARED',
    lines: o.lines.map(l => ({ pid: l.pid, base: l.base })), delivered: null, createdAt: new Date(), revs: [], extra: o.extra || {} };
  d.revs.push({ at: new Date(), note: 'Prepared', lines: d.lines.map(l => ({ ...l })) });
  S.challans.push(d); return d;
}
function reviseDC(d, note) { d.revs.push({ at: new Date(), note, lines: d.lines.map(l => ({ ...l })) }); }
function prepareTrip(orderIds) {
  if (!orderIds.length) fail('Select at least one order.');
  for (const id of orderIds) {
    const o = orderOf(id);
    if (!o || o.status !== 'WAITING') fail('Order ' + (o ? o.no : '') + ' is not waiting for a pickup.');
    if (o.needsApproval && !o.approved) fail('Order ' + o.no + ' needs Manager approval first.');
  }
  const t = { id: nid('t'), no: 'PK-' + String(++S.nums.PK).padStart(3, '0'), status: 'LOADING', orderIds: orderIds.slice(), vehicleId: null, driverId: null, helperId: null, cameraId: null,
    createdAt: new Date(), counted: {}, custody: {}, loaded: {}, unsafe: [], sideSaleIds: [], shortages: [], matches: {}, handoverId: null, goods: null, closeSummary: null, notes: [] };
  S.trips.push(t);
  for (const id of orderIds) {
    const o = orderOf(id);
    o.status = 'LOADING'; o.tripId = t.id; o.alloc = {}; o.lines.forEach(l => o.alloc[l.pid] = (o.alloc[l.pid] || 0) + l.base);
    const dc = makeDC('ORDER', { orderId: o.id, tripId: t.id, partyId: o.partyId, lines: Object.keys(o.alloc).map(pid => ({ pid, base: o.alloc[pid] })) });

  if (salePaid(s, true) > 0) { fail('A payment was already recorded — a discount can only be given before payment.'); }
  if (!(bp > 0 && bp <= 2000)) { fail('Enter a discount between 0.01% and 20%.'); }
  tokUse(token);
  const amt = pctOf(s.gross, bp);
  s.discount = { bp, amt, at: new Date(), by: 'Owner (simulated approval)' };
  if (s.partyId) post(s.partyId, 'SALES', amt, 'Discount ' + pctText(bp) + ' on bill ' + s.no + ' (Owner approved)', { type: 'SALE', id: s.id });
  approve('OWNER_DISCOUNT', 'Owner approved ' + pctText(bp) + ' discount on bill ' + s.no + ': ' + rs(s.gross) + ' → ' + rs(saleTotal(s)));
  return s;
}

/* ---- pending list used by Today and CashBook ---- */
const pendingPayments = () => S.payments.filter(p => p.stage === 'PENDING');
const cashWithDrivers = () => S.payments.filter(p => p.method === 'CASH' && (p.stage === 'WITH_COLLECTOR' || p.stage === 'HANDED'));
const stageTone = st => (st === 'VERIFIED' || st === 'CLEARED') ? 'ok' : (st === 'FLAGGED' || st === 'BOUNCED') ? 'bad' : 'warn';

/* ---- pickup return: money handover (driver → Manager → office verified) ---- */
const tripCash = t => S.payments.filter(p => p.tripId === t.id && p.method === 'CASH' && (p.stage === 'WITH_COLLECTOR' || p.stage === 'HANDED'));
const tripPayments = t => S.payments.filter(p => p.tripId === t.id && payActive(p));
function handoverCount(tid, counted, note) {
  const t = tripOf(tid); if (!t) fail('Pickup not found.');
  const ps = tripCash(t), expected = ps.reduce((s, p) => s + p.amount, 0);
  if (!(counted >= 0)) fail('Enter the counted cash.');
  if (counted !== expected && !(note || '').trim()) fail('Counted cash is ' + rs(Math.abs(counted - expected)) + (counted < expected ? ' short' : ' extra') + ' — write a short note to explain.');
  let h = t.handoverId ? byId(S.handovers, t.handoverId) : null;
  if (h && h.status === 'VERIFIED') fail('The money was already verified.');
  if (!h) { h = { id: nid('h'), no: nextNo('H', 'H'), tripId: t.id, collectorId: t.driverId }; S.handovers.push(h); t.handoverId = h.id; }
  Object.assign(h, { expected, counted, diff: counted - expected, note: (note || '').trim(), at: new Date(), status: 'COUNTED', payIds: ps.map(p => p.id) });
  ps.forEach(p => { p.stage = 'HANDED'; p.handoverId = h.id; });
  log('HANDOVER', staffOf(t.driverId).name + ' handed ' + rs(counted) + ' to the Manager (expected ' + rs(expected) + ')', { trip: t.id });
  return h;
}
function verifyHandover(t) {
  const h = t.handoverId ? byId(S.handovers, t.handoverId) : null;
  if (!h || h.status !== 'COUNTED') return null;
  if (h.counted > 0) cashPost('CASH', h.counted, 'RECEIPT', 'Pickup cash', t.no + ' — cash handed over by ' + staffOf(h.collectorId).name, { pid: h.collectorId, ref: { type: 'HANDOVER', id: h.id } });
  post(h.collectorId, 'COLLECTION', h.counted, 'Cash handed to Manager and verified (' + t.no + ')', { type: 'HANDOVER', id: h.id });
  h.status = 'VERIFIED'; h.verifiedAt = new Date();
  h.payIds.forEach(id => { const p = payOf(id); if (p) { p.stage = 'VERIFIED'; p.verifiedAt = new Date(); p.verifiedBy = 'Manager (simulated)'; } });
  if (h.diff < 0) log('DIFFERENCE', 'Cash short by ' + rs(-h.diff) + ' on ' + t.no + ' — stays on ' + staffOf(h.collectorId).name + "'s Khata until explained: " + h.note);
  if (h.diff > 0) log('DIFFERENCE', 'Cash extra by ' + rs(h.diff) + ' on ' + t.no + ' — recorded for ' + staffOf(h.collectorId).name + ': ' + h.note);
  return h;
}
function tripSummary(t) {
  const dl = S.deliveries.filter(d => d.tripId === t.id), delivered = {};
  dl.forEach(d => { for (const p in d.accepted) delivered[p] = (delivered[p] || 0) + d.accepted[p]; });
  const sold = {}; t.sideSaleIds.forEach(id => saleOf(id).lines.forEach(l => sold[l.pid] = (sold[l.pid] || 0) + l.base));
  const pays = tripPayments(t), collected = pays.reduce((s, p) => s + p.amount, 0);
  const cashExpected = pays.filter(p => p.method === 'CASH').reduce((s, p) => s + p.amount, 0);
  const h = t.handoverId ? byId(S.handovers, t.handoverId) : null;
  const dues = S.sales.filter(s => s.tripId === t.id).reduce((s, x) => s + Math.max(0, saleDue(x)), 0);
  return { delivered, sold, collected, cashExpected, handover: h, cashVerified: h && h.status === 'VERIFIED' ? h.counted : 0, cashCounted: h ? h.counted : null, dues,
    online: pays.filter(p => p.method !== 'CASH').reduce((s, p) => s + p.amount, 0) };
}
/* Close the pickup only when EVERYTHING on the vehicle is accounted for and money is counted. */
function closeTrip(tid, goods, token) {
  const t = tripOf(tid); if (!t || t.status !== 'RETURNED') fail('This pickup is not waiting for the return check.');
  if (tokUsed(token)) return t;
  for (const pid in t.custody) {
    if (!t.custody[pid]) continue;
    const g = goods[pid] || { good: 0, damaged: 0, expired: 0, short: 0 };
    if (g.good + g.damaged + g.expired + g.short !== t.custody[pid]) { fail('Account for every ' + prod(pid).name + ' still on the pickup (' + qtyText(prod(pid), t.custody[pid]) + ').'); }
  }
  const hh0 = t.handoverId ? byId(S.handovers, t.handoverId) : null;
  if (tripCash(t).length && !(hh0 && hh0.status === 'COUNTED')) { fail('Count the cash handed over by the driver first.'); }
  for (const o of tripOrders(t)) if (!t.matches[o.id]) { fail('Check the order of ' + partyName(o.partyId) + ' first.'); }
  tokUse(token);
  for (const pid in t.custody) {
    const g = goods[pid]; if (!g || !t.custody[pid]) continue;
    if (g.good) moveGodown(pid, g.good, 'Good return', t.no, 'Unsold goods returned in good condition');
    if (g.damaged) addHold(pid, g.damaged, 'DAMAGED', t.no + ' return');
    if (g.expired) addHold(pid, g.expired, 'EXPIRED', t.no + ' return');
    if (g.short) { t.shortages.push({ pid, base: g.short, at: new Date() }); log('DIFFERENCE', t.no + ': ' + qtyText(prod(pid), g.short) + ' ' + prod(pid).name + ' SHORT / missing — recorded for explanation', { trip: t.id }); }
    t.custody[pid] = 0;
  }
  t.goods = goods;
  verifyHandover(t);
  t.status = 'CLOSED'; t.closedAt = new Date();
  t.closeSummary = tripSummary(t);
  log('PICKUP', t.no + ' closed — everything accounted for', { trip: t.id });
  return t;
}

/* ---- stock receiving: viewing an invoice never changes stock; only the confirmed physical count does ---- */
const invBase = l => l.base > 0 ? l.base : l.boxes * prod(l.pid).levels[0].n;      // purchases entered in the app carry an exact base quantity
function receiveInvoice(invId, actual, note, token) {
  const inv = byId(S.invoices, invId); if (!inv) fail('Invoice not found.');
  if (inv.status !== 'OPEN') fail('This invoice was already received.');
  if (tokUsed(token)) return inv;
  const diffs = [];
  for (const l of inv.lines) {
    const a = actual[l.pid]; if (a == null || a < 0) fail('Enter the physical count for ' + prod(l.pid).name + '.');
    if (a !== invBase(l)) diffs.push({ pid: l.pid, expected: invBase(l), actual: a });
  }
  if (diffs.length && !(note || '').trim()) fail('Some counts differ from the invoice — write a short note about the difference.');
  tokUse(token);
  for (const l of inv.lines) if (actual[l.pid] > 0) moveGodown(l.pid, actual[l.pid], 'Purchase receipt', inv.no, (note || '').trim());
  inv.status = 'RECEIVED'; inv.receivedAt = new Date(); inv.actual = { ...actual }; inv.note = (note || '').trim(); inv.diffs = diffs;
  log('STOCK', 'Invoice ' + inv.no + ' received into the godown' + (diffs.length ? ' with ' + diffs.length + ' difference(s)' : ''), { inv: inv.id });
  return inv;
}
const COUNT_REASONS = ['Counting mistake earlier', 'Goods damaged', 'Goods missing', 'Extra goods found', 'Other'];
function applyCount(pid, counted, reason, note, token) {
  const diff = counted - avail(pid);
  if (counted < 0) fail('Enter the counted quantity.');
  if (tokUsed(token)) return diff;
  if (diff === 0) { tokUse(token); log('STOCK', prod(pid).name + ' counted — matches the system (' + qtyText(prod(pid), counted) + ')'); return 0; }
  if (!reason) fail('Choose why the count is different.');
  tokUse(token);
  moveGodown(pid, diff, 'Count correction', null, reason + (note ? ' — ' + note.trim() : ''));
  log('STOCK', prod(pid).name + ' count corrected by ' + (diff > 0 ? '+' : '−') + qtyText(prod(pid), Math.abs(diff)) + ' (' + reason + ')');
  return diff;
}

/* ---- staff: position, duty and earning model are independent. Driver is a DUTY, not a position. ---- */
const curModel = s => s.model;
function markAttendance(sid, dateStr, status) {
  const s = staffOf(sid); if (!s || !s.active) fail('Staff member not available.');
  if (dateStr > ymd(new Date())) fail('You cannot mark attendance for a future day.');
  const prev = s.att[dateStr];
  if (prev && prev.status === status) return prev;
  const daily = s.model.salary.on && s.model.salary.method === 'DAILY';
  const at = parseYmd(dateStr);
  const rec = prev || { status: null, rate: s.model.salary.rate, hist: [] };
  if (prev && prev.status === 'PRESENT' && daily) post(sid, 'WAGES', -prev.rate, 'Attendance corrected for ' + fmtD(at) + ' — day wage reversed', { type: 'ATT', date: dateStr });
  if (status === 'PRESENT' && daily) { rec.rate = prev ? prev.rate : s.model.salary.rate; post(sid, 'WAGES', rec.rate, 'Present on ' + fmtD(at) + ' — day wage earned (not yet paid)', { type: 'ATT', date: dateStr }); }
  rec.status = status; rec.hist.push({ at: new Date(), status }); s.att[dateStr] = rec;
  log('ATTENDANCE', s.name + ' marked ' + status.toLowerCase() + ' for ' + fmtD(at) + (prev ? ' (correction)' : ''));
  return rec;
}
const DUTIES = { DRIVER: 'Driver', LOADING: 'Loading', UNLOADING: 'Unloading', PICKING: 'Picking & checking', COUNTER: 'Retail counter', NONE: 'No special duty' };
function currentDuty(s) {
  const t = S.trips.find(x => tripLive(x) && (x.driverId === s.id || x.helperId === s.id));
  if (t) return (t.driverId === s.id ? 'Driver' : 'Helper') + ' on ' + t.no + ' (' + vehOf(t.vehicleId).reg + ')';
  return s.duty ? DUTIES[s.duty.type] + (s.duty.note ? ' — ' + s.duty.note : '') : 'No special duty';
}
function setDuty(sid, type, note) {
  const s = staffOf(sid); if (!s || !s.active) fail('Staff member not available.');
  if (type === 'DRIVER' && !s.driver) fail(s.name + ' is not driver-eligible. Turn on driver eligibility in Settings → Staff first.');
  s.duty = type === 'NONE' ? null : { type, note: (note || '').trim(), since: new Date() };
  log('DUTY', s.name + ' assigned: ' + DUTIES[type] + ' (position unchanged: ' + posLabel[s.position] + ')');
}
function earningText(s) {
  const m = s.model, parts = [];
  if (m.salary.on) parts.push('Salary ' + (m.salary.method === 'DAILY' ? rs(m.salary.rate) + ' per day' : rs(m.salary.rate) + ' per month')); else parts.push('Salary OFF');
  parts.push(m.commission.on ? 'Commission ' + pctText(m.commission.bp) : 'Commission OFF');
  return parts.join(' · ');
}
function updateModel(sid, next, reason) {
  const s = staffOf(sid); if (!s) fail('Staff member not found.');
  if (s.position === 'AGENT' && next.salary.on) fail('An independent Agent has no salary. Use Personal Agent for salary + commission.');
  if (next.salary.on && !(next.salary.rate > 0)) fail('Enter the salary amount.');
  if (next.commission.on && !(next.commission.bp > 0 && next.commission.bp <= 2000)) fail('Commission must be between 0.01% and 20%.');
  s.model = JSON.parse(JSON.stringify(next));
  s.hist.push({ at: new Date(), note: (reason || 'Earning model changed'), model: JSON.parse(JSON.stringify(next)), position: s.position });
  log('STAFF', s.name + ' earning model changed: ' + earningText(s));
}
function changePosition(sid, pos, reason) {
  const s = staffOf(sid); if (!s) fail('Staff member not found.');
  const was = s.position; s.position = pos;
  if (pos === 'AGENT') { s.model.salary = { on: false, method: 'NONE', rate: 0 }; if (!s.model.commission.on) s.model.commission = { on: true, bp: S.settings.agentBp || 100 }; }
  s.hist.push({ at: new Date(), note: (reason || 'Position changed') + ' (' + posLabel[was] + ' → ' + posLabel[pos] + ')', model: JSON.parse(JSON.stringify(s.model)), position: pos });
  log('STAFF', s.name + ': ' + posLabel[was] + ' → ' + posLabel[pos] + '. Earlier earnings and history are kept.');
}
function addStaff(d) {
  const name = (d.name || '').trim(); if (name.length < 2) fail('Enter the staff name.');
  const s = { id: nid('s'), name, position: d.position || 'HELPER', driver: !!d.driver, areas: [], active: true, att: {}, duty: null,
    model: d.position === 'AGENT' ? { salary: { on: false, method: 'NONE', rate: 0 }, commission: { on: true, bp: 100 } } : { salary: { on: true, method: 'DAILY', rate: 50000 }, commission: { on: false, bp: 0 } } };
  s.hist = [{ at: new Date(), note: 'Joined — ' + posLabel[s.position], model: JSON.parse(JSON.stringify(s.model)), position: s.position }];
  S.staff.push(s); log('STAFF', name + ' added as ' + posLabel[s.position]); return s;
}
/* off-duty unloading: ONE fee per job, paid to ONE coordinator — never multiplied by the number of workers */
function unloadingJob(o) {
  const ref = (o.ref || '').trim(); if (!ref) fail('Enter a job reference.');
  if (S.jobs.some(j => j.ref.toLowerCase() === ref.toLowerCase())) fail('Job ' + ref + ' was already recorded — it cannot be paid twice.');
  if (!o.coordinatorId || !staffOf(o.coordinatorId)) fail('Choose the one person who gets the unloading amount.');
  const fee = o.offDuty ? S.settings.unloadFee : 0;
  const j = { id: nid('j'), ref, coordinatorId: o.coordinatorId, offDuty: !!o.offDuty, workers: o.workers || 1, time: o.time || '', fee, at: new Date() };
  S.jobs.push(j);
  if (fee) post(j.coordinatorId, 'UNLOADING', fee, 'Off-duty unloading job ' + ref + ' (' + (o.time || 'night') + ') — one fee for the whole job', { type: 'JOB', id: j.id });
  log('UNLOADING', 'Unloading job ' + ref + ': ' + (fee ? rs(fee) + ' payable to ' + staffOf(j.coordinatorId).name + ' (once, not per worker)' : 'on-duty — no extra charge'));
  return j;
}

/* ---- payouts: an ACTUAL payment changes the CashBook AND the Khata together, once ---- */
function payDue(pid, cat, amount, acct, note, offset, token) {
  if (tokUsed(token)) fail('This payment was already made.');
  if (!(amount >= 0) || (!amount && !offset)) fail('Enter an amount to pay.');
  offset = offset || 0;
  if (kbal(pid, cat) < amount + offset) fail('The agency only owes ' + rs(Math.max(0, kbal(pid, cat))) + ' as ' + KCAT[cat].toLowerCase() + '.');
  if (offset && -kbal(pid, 'ADVANCE') < offset) fail('The advance is only ' + rs(-kbal(pid, 'ADVANCE')) + '.');
  tokUse(token);
  if (amount) {
    cashPost(acct, -amount, 'PAYMENT', KCAT[cat], KCAT[cat] + ' paid to ' + partyName(pid) + (note ? ' — ' + note : ''), { pid, ref: { type: 'PAYOUT' } });
    post(pid, cat, -amount, KCAT[cat] + ' paid by ' + (acct === 'CASH' ? 'cash' : 'bank') + (note ? ' — ' + note : ''), { type: 'PAYOUT' });
  }
  if (offset) { post(pid, cat, -offset, 'Offset against advance (no cash paid)', { type: 'OFFSET' }); post(pid, 'ADVANCE', offset, 'Advance cleared from ' + KCAT[cat].toLowerCase(), { type: 'OFFSET' }); }
  log('PAYOUT', rs(amount) + ' ' + KCAT[cat].toLowerCase() + ' paid to ' + partyName(pid) + (offset ? ' (+ ' + rs(offset) + ' advance offset)' : ''));
}
function giveAdvance(pid, amount, acct, note, token) {
  if (tokUsed(token)) fail('This advance was already recorded.');
  if (!(amount > 0)) fail('Enter the advance amount.');
  tokUse(token);
  cashPost(acct, -amount, 'PAYMENT', 'Advance', 'Advance paid to ' + partyName(pid) + (note ? ' — ' + note : ''), { pid });
  post(pid, 'ADVANCE', -amount, 'Advance given' + (note ? ' — ' + note : ''), { type: 'ADVANCE' });
  log('PAYOUT', 'Advance ' + rs(amount) + ' given to ' + partyName(pid));
}

/* ---- expenses: type → amount → note → approve → pay.  Manager cannot approve (Owner/CEO checkpoint). ---- */
function addExpense(o) {
  if (tokUsed(o.token)) fail('This expense was already added.');
  if (!o.cat) fail('Choose the expense type.');
  if (!(o.amount > 0)) fail('Enter the amount.');
  tokUse(o.token);
  const x = { id: nid('x'), no: nextNo('EX', 'EX'), cat: o.cat, amount: o.amount, note: (o.note || '').trim(), status: 'PENDING', at: new Date() };
  S.expenses.push(x); log('EXPENSE', 'Expense ' + x.no + ' ' + o.cat + ' ' + rs(x.amount) + ' noted — waiting for approval'); return x;
}
function approveExpense(id) { const x = byId(S.expenses, id); if (!x || x.status !== 'PENDING') fail('Nothing to approve.'); x.status = 'APPROVED'; approve('OWNER_EXPENSE', 'Owner approved expense ' + x.no + ' (' + x.cat + ' ' + rs(x.amount) + ') — Manager cannot approve expenses'); }
function payExpense(id, acct, token) {
  const x = byId(S.expenses, id); if (!x) fail('Expense not found.');
  if (x.status === 'PAID') fail('This expense was already paid.');
  if (x.status !== 'APPROVED') fail('Approve the expense first.');
  if (tokUsed(token)) return x;
  cashPost(acct, -x.amount, 'PAYMENT', x.cat, x.cat + (x.note ? ' — ' + x.note : ''), { ref: { type: 'EXPENSE', id: x.id } });
  tokUse(token); x.status = 'PAID'; x.paidAt = new Date(); x.acct = acct;
  log('EXPENSE', 'Expense ' + x.no + ' paid ' + rs(x.amount) + ' from ' + (acct === 'CASH' ? 'cash' : 'bank')); return x;
}
function transferMoney(from, amount, token) {
  const to = from === 'CASH' ? 'BANK' : 'CASH';
  if (tokUsed(token)) fail('This transfer was already made.');
  if (!(amount > 0)) fail('Enter the amount to move.');
  if (cbal(from) < amount) fail('Only ' + rs(cbal(from)) + ' is available in ' + (from === 'CASH' ? 'cash' : 'the bank') + '.');
  tokUse(token);
  cashPost(from, -amount, 'TRANSFER', 'Transfer', 'Moved to ' + (to === 'CASH' ? 'cash' : 'bank'), { ref: { type: 'TRANSFER' } });
  cashPost(to, amount, 'TRANSFER', 'Transfer', 'Moved from ' + (from === 'CASH' ? 'cash' : 'bank'), { ref: { type: 'TRANSFER' } });
  log('TRANSFER', rs(amount) + ' moved from ' + (from === 'CASH' ? 'cash to bank' : 'bank to cash') + ' (same money, new place — not income)');
}

/* ---- customer returns: goods first, money later (and only if approved) ---- */
function customerReturn(o) {
  if (tokUsed(o.token)) fail('This return was already recorded.');
  if (!party(o.partyId)) fail('Choose the customer.');
  if (!(o.base > 0)) fail('Enter how much came back.');
  tokUse(o.token);
  const r = { id: nid('r'), no: nextNo('RT', 'RT'), partyId: o.partyId, pid: o.pid, base: o.base, kind: o.kind, note: (o.note || '').trim(), at: new Date(), credit: null };
  S.returns.push(r);
  addHold(o.pid, o.base, o.kind, 'returned by ' + partyName(o.partyId), r.note);      // NEVER goes into sellable stock
  log('RETURN', qtyText(prod(o.pid), o.base) + ' ' + prod(o.pid).name + ' ' + o.kind.toLowerCase() + ' returned by ' + partyName(o.partyId) + ' — kept out of sellable stock');
  return r;
}
const returnValue = r => r.base * prod(r.pid).sell;
function decideCredit(rid, mode, amount) {
  const r = byId(S.returns, rid); if (!r) fail('Return not found.');
  if (r.credit) fail('A decision was already made for this return.');
  if (!(amount > 0) || amount > returnValue(r)) fail('Amount must be between ₹0.01 and ' + rs(returnValue(r)) + '.');
  if (mode === 'KHATA') post(r.partyId, 'SALES', amount, 'Credit for ' + r.kind.toLowerCase() + ' return ' + r.no + ' (approved)', { type: 'RETURN', id: r.id });
  else {
    const acct = mode === 'CASH' ? 'CASH' : 'BANK';
    post(r.partyId, 'REFUND', amount, 'Refund approved for return ' + r.no, { type: 'RETURN', id: r.id });
    cashPost(acct, -amount, 'PAYMENT', 'Refund', 'Refund to ' + partyName(r.partyId) + ' for return ' + r.no, { pid: r.partyId, ref: { type: 'RETURN', id: r.id } });
    post(r.partyId, 'REFUND', -amount, 'Refund paid by ' + (mode === 'CASH' ? 'cash' : 'bank'), { type: 'RETURN', id: r.id });
  }
  r.credit = { mode, amount, at: new Date() };
  approve('OWNER_CREDIT', 'Approved ' + (mode === 'KHATA' ? 'Khata credit' : mode === 'CASH' ? 'cash refund' : 'bank refund') + ' ' + rs(amount) + ' for ' + r.no);
}

/* ---- retail counter: stock comes from a manager-approved retail allocation, never silently from the godown ---- */
function retailAllocate(pid, base) {
  if (!(base > 0)) fail('Enter the quantity to issue to the counter.');
  moveGodown(pid, -base, 'Retail issue', 'counter', 'Manager approved retail allocation');
  S.retail[pid] = (S.retail[pid] || 0) + base;
  approve('MANAGER_STOCK', 'Manager approved ' + qtyText(prod(pid), base) + ' ' + prod(pid).name + ' for the retail counter');
}
function retailSale(o) {
  const pr = prod(o.pid);
  if (tokUsed(o.token)) fail('This sale was already recorded.');
  if (!(o.base > 0)) fail('Enter the quantity.');
  if ((S.retail[o.pid] || 0) < o.base) fail('The counter has only ' + qtyText(pr, S.retail[o.pid] || 0) + ' of ' + pr.name + '.');
  if (o.method !== 'CASH' && o.method !== 'UPI') fail('Counter sales take cash or UPI.');
  tokUse(o.token);
  S.retail[o.pid] -= o.base;                                       // retail counter stock only — godown is NOT touched again
  const s = createSale({ source: 'RETAIL', partyId: null, buyerName: 'Walk-in customer', lines: [{ pid: o.pid, base: o.base, rate: pr.retail, units: {} }], cashAndCarry: true });
  recordPayment({ partyId: null, saleId: s.id, method: o.method, amount: saleTotal(s), details: { ref: o.ref }, collectorId: null });
  return s;
}

/* ---- godown direct sale & inter-agency sale: not a pickup trip; stock leaves the godown ONCE when handed over ---- */
function directSale(o) {
  if (tokUsed(o.token)) fail('This sale was already confirmed.');
  if (!party(o.partyId)) fail('Choose the buyer.');
  if (!o.lines.length) fail('Add at least one product.');
  if (needsApprovalParty(o.partyId) && !o.approved) fail('Manager approval is needed before goods are handed to an Agent or Retailer.');
  for (const l of o.lines) {

/* ---- attention list (only meaningful pending work) ---- */
function tripGo(t) {
  if (t.status === 'LOADING') { return nav.go(!t.vehicleId ? 'pk.vehicle' : !t.driverId ? 'pk.driver' : !t.helperDone ? 'pk.helper' : 'pk.load', { tid: t.id }); }
  if (t.status === 'READY') return nav.go('pk.ready', { tid: t.id });
  if (t.status === 'ON_ROAD') return nav.go('pk.road', { tid: t.id });
  if (t.status === 'RETURNED') return nav.go('tr.goods', { tid: t.id });
  return nav.go('pk.view', { tid: t.id });
}
function attention() {
  const out = [];
  const waiting = S.orders.filter(o => o.status === 'WAITING');
  const need = waiting.filter(o => o.needsApproval && !o.approved).length;
  if (waiting.length) out.push({ n: waiting.length, text: waiting.length === 1 ? 'Order waiting' : 'Orders waiting', sub: need ? need + ' need Manager approval' : 'Ready for loading', go: () => nav.go('orders.all', { filter: 'WAITING' }) });
  const by = st => S.trips.filter(t => t.status === st);
  by('LOADING').forEach(t => out.push({ n: 1, text: 'Pickup loading', sub: t.no + ' · ' + (t.vehicleId ? vehOf(t.vehicleId).reg : 'choose pickup'), go: () => tripGo(t) }));
  by('READY').forEach(t => out.push({ n: 1, text: 'Pickup ready', sub: t.no + ' · ' + vehOf(t.vehicleId).reg + ' — start the trip', go: () => tripGo(t) }));
  const road = by('ON_ROAD'); if (road.length) out.push({ n: road.length, text: road.length === 1 ? 'Pickup on road' : 'Pickups on road', sub: road.map(t => vehOf(t.vehicleId).reg).join(', '), go: () => road.length === 1 ? tripGo(road[0]) : nav.go('pk.list') });
  by('RETURNED').forEach(t => out.push({ n: 1, text: 'Pickup back — check cash', sub: t.no + ' · ' + vehOf(t.vehicleId).reg, tone: 'red', go: () => tripGo(t) }));
  const collect = S.sales.filter(s => !s.cashAndCarry && !s.legacy && s.partyId && s.source !== 'DIRECT' && saleDue(s) > 0 && !s.dueMarked && (s.orderId || s.source === 'SIDE'));
  collect.forEach(s => out.push({ n: 1, text: 'Delivered — collect money', sub: partyName(s.partyId) + ' · ' + rs(saleDue(s)), tone: 'red', go: () => nav.go('col.home', { sid: s.id }) }));
  const pend = pendingPayments(); if (pend.length) out.push({ n: pend.length, text: pend.length === 1 ? 'Payment needs verification' : 'Payments need verification', sub: 'Not counted as money until checked', go: () => nav.go('cash.pend') });
  return out;
}

}

/* =====================================================================
   THE CART — one set of screens for: Taking Order · Godown Sale · Inter-agency Sale
   Customer → Products → How many? → Review → (confirm)
   ===================================================================== */
const CARTS = {
  order: { label: 'TAKING ORDER', title: 'Taking Order', who: 'WHICH CUSTOMER?', done: 'DONE TAKING ORDER', confirm: 'CONFIRM ORDER', steps: 4 },
  godown: { label: 'GODOWN SALE', title: 'Godown Sale', who: 'WHO IS BUYING?', done: 'REVIEW SALE', confirm: 'CONTINUE', steps: 6, reviewN: 4 },
  ia: { label: 'INTER-AGENCY SALE', title: 'Inter-agency Sale', who: 'WHICH AGENCY?', done: 'AGREE THE RATE', confirm: 'CONTINUE', steps: 6, reviewN: 5 },
};
function cartOf(mode) { return S.drafts[mode] || (S.drafts[mode] = { mode, partyId: null, lines: [], tok: nid('tok'), editId: null, extra: {} }); }
function partiesFor(mode) {
  const shops = S.customers.filter(c => c.type === 'SHOP'), agents = S.staff.filter(s => s.active && needsApprovalParty(s.id));
  if (mode === 'order') return shops.concat(agents);
  if (mode === 'godown') return shops.concat(agents, S.customers.filter(c => c.type === 'OCCASIONAL'));
  if (mode === 'ia') return S.customers.filter(c => c.type === 'AGENCY');
  return shops;
}
function cartRates(c) {                      // per-base rates used for this cart
  const m = currentPrices(); if (c.editId) Object.assign(m, orderOf(c.editId).prices);
  if (c.mode === 'ia') Object.assign(m, c.extra.rates || {});
  return m;
}
const cartCalc = c => totalsOf(c.lines, cartRates(c));

const prodDraft = () => S.drafts.prod || (S.drafts.prod = emptyProd());
const unitWord = (base, n) => base === 'PCS' ? (n === 1 ? 'piece' : 'pieces') : (n === 1 ? 'packet' : 'packets');
function packLevels(d) {
  const box = parseInt(d.box, 10), mid = parseInt(d.midN, 10), u = unitWord(d.base, 2);
  if (!(box > 1)) fail('Enter how many ' + u + ' are in 1 BOX.');
  const levels = [{ u: 'BOX', n: box }];
  if (d.mid) { if (!(mid > 1 && mid < box)) fail('1 ' + d.mid + ' must hold more than 1 and fewer ' + u + ' than a BOX (' + box + ').'); levels.push({ u: d.mid, n: mid }); }

function addProduct(d) {

  if (S.products.some(p => p.name.toLowerCase() === name.toLowerCase())) fail('A product called ' + name + ' already exists.');
  const levels = packLevels(d), mrp = parseRs(d.mrp), buy = parseRs(d.buy), sell = parseRs(d.sell), retail = (d.retail || '') === '' ? mrp : parseRs(d.retail);
  if (!(mrp > 0)) fail('Enter the printed MRP.');
  if (!(buy > 0)) fail('Enter the buying price.');
  if (!(sell > 0)) fail('Enter the Sell-to-Shop price.');
  if (!(retail > 0)) fail('Enter the retail counter price.');
  if (sell > mrp || retail > mrp) fail('A selling price cannot be more than the MRP (' + rs(mrp) + ').');
  const pr = { id: nid('p'), name, mrp, base: d.base, levels, buy, sell, retail, nick: name.toLowerCase(), active: true };
  S.products.push(pr); S.godown[pr.id] = 0; S.retail[pr.id] = 0;
